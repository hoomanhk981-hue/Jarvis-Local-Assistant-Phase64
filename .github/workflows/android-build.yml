name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        id: locate
        run: |
          match=$(find "$GITHUB_WORKSPACE" -maxdepth 5 -name "settings.gradle.kts" | head -n1)
          if [ -z "$match" ]; then
            echo "::error::Could not find settings.gradle.kts anywhere in the repo. Check that the project files were pushed correctly."
            exit 1
          fi
          proj_dir=$(dirname "$match")
          echo "Found Android project at: $proj_dir"
          echo "dir=$proj_dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;29.0.13113456"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle wrapper --gradle-version 9.3.1 --no-daemon

      - name: Preflight
        working-directory: ${{ steps.locate.outputs.dir }}
        run: python3 scripts/preflight.py
        continue-on-error: true

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
