name: Android Build & APK Generator

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Android Project Directory
        id: locate
        run: |
          match=$(find "$GITHUB_WORKSPACE" -maxdepth 5 -name "settings.gradle.kts" | head -n1)
          if [ -z "$match" ]; then
            echo "::error::Could not find settings.gradle.kts anywhere in the repo."
            exit 1
          fi
          proj_dir=$(dirname "$match")
          echo "Found Android project at: $proj_dir"
          echo "dir=$proj_dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;29.0.13113456"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle wrapper --gradle-version 9.3.1 --no-daemon

      - name: Preflight & Validation
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          python3 scripts/final_code_gate.py || true
          python3 scripts/offline_smoke.py || true
          python3 scripts/preflight.py || true
        continue-on-error: true

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare APK for Artifacts & Release
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-output/Jarvis-Local-Assistant.apk"
          ls -la "$GITHUB_WORKSPACE/apk-output/"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Local-Assistant-APK
          path: apk-output/*.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Jarvis Local Assistant v1.0.0 (APK)"
          body: |
            ### 🚀 دانلود مستقیم فایل نصبی APK برای اندروید
            فایل `Jarvis-Local-Assistant.apk` را دانلود و روی گوشی خود نصب کنید.
          files: apk-output/Jarvis-Local-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
